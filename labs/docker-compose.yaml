name: my-site

services:
  web:
    build: ./backend
    container_name: flask_app
    restart: always
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web

